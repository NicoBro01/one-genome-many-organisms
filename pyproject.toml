[project]
name = "nca"
version = "0.1.0"
description = "Neural Cellular Automata with a heritable genome: one growth rule, many organisms."
readme = "README.md"
authors = [
    { name = "NicoBro01" }
]
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
